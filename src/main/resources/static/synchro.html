<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jester Studio</title>
    <link rel="stylesheet" href="./proDemo/synchro.css" />
</head>

<body class="editor-body">
    <!-- Topbar -->
    <header class="studio-topbar">
        <div class="topbar-left">
            <img class="studio-brand-icon" src="./proDemo/editorImg/studioicon.png" alt="Jester Studio Icon" />
            <span class="app-title">Jester Studio</span>
            <label class="file-pill" for="audioFileInput">
                <span>Add Music</span>
                <input id="audioFileInput" type="file" accept="audio/*" />
            </label>
        </div>

        <div class="topbar-right">
            <button id="btnExportMoments" class="t-btn" type="button">Export JSON</button>
        </div>
    </header>

    <!-- Upper Workspace: Collapsible Left "Moment Edit" Panel + 3D Stage -->
    <section class="workspace-upper">
        <!-- Left Collapsible Panel (Clipchamp style) -->
        <aside id="momentEditPanel" class="moment-edit-panel">
            <div class="panel-header">
                <span class="panel-title">Moment Edit</span>
                <button id="btnTogglePanel" class="panel-arrow-btn" type="button" title="Collapse Moment Edit">
                    &#9664;
                </button>
            </div>

            <div class="panel-body">
                <div class="panel-badge-row">
                    <span class="panel-label">Selected Moment</span>
                    <span id="activeMomentBadge" class="moment-badge">None</span>
                </div>

                <div class="panel-field">
                    <label class="panel-label" for="momentEditTitleInput">Moment Title</label>
                    <input id="momentEditTitleInput" type="text" class="panel-input" placeholder="Select a moment..."
                        disabled />
                </div>

                <div class="panel-field">
                    <label class="panel-label" for="savedProductSelect">Saving Product</label>
                    <div class="panel-inline">
                        <select id="savedProductSelect">
                            <option value="">-- Saving Product --</option>
                        </select>
                        <button id="btnRefreshProducts" class="t-btn" type="button">Reload</button>
                    </div>
                </div>

                <button id="btnEditMomentIn3D" class="t-btn full-w" type="button" disabled>
                    Edit Design in 3D
                </button>

                <button id="btnApplyMomentBinding" class="t-btn t-btn-accent full-w" type="button" disabled>
                    Save Moment Changes
                </button>

                <div class="panel-divider"></div>

                <div class="panel-badge-row">
                    <span class="panel-label">Moments List</span>
                    <span id="panelMomentsCount" class="mono">0</span>
                </div>
                <div id="momentListContainer" class="moment-list">
                    <div class="moment-list-empty">No moments created yet.</div>
                </div>
            </div>
        </aside>

        <!-- Expand Button shown when Left Panel is collapsed -->
        <button id="btnExpandPanel" class="panel-expand-tab is-hidden" type="button" title="Expand Moment Edit">
            &#9654;
        </button>

        <!-- Center 3D Stage -->
        <div id="synchro-viewport" class="stage-canvas-wrap">
            <iframe id="stageFrame" class="stage-frame" title="3D Stage" scrolling="no"></iframe>
            <div class="grid-overlay"></div>
        </div>
    </section>

    <!-- Bottom Timeline Dock -->
    <section class="timeline-dock">
        <div class="timeline-toolbar">
            <!-- Left side of Play button: Active music / moment name, ending 50px before Play button -->
            <div class="toolbar-left-info">
                <span id="audioFileName" class="active-track-label">No music loaded</span>
            </div>

            <!-- Centered Jester Play/Stop Button + Timecode -->
            <div class="transport-group">
                <button id="btnPlayStopToggle" class="jester-transport-btn is-stopped" type="button" title="Play"
                    aria-label="Play" disabled>
                    <img id="playStopIconImg" src="./proDemo/editorImg/playbutton.jpg" alt="Play" />
                </button>
                <span id="audioDurationLabel" class="mono">00:00.0 / 00:00.0</span>
            </div>

            <!-- Right Group: Create Moment -->
            <div class="create-moment-group">
                <div class="create-moment-left">
                    <span class="cm-label">Create Moment</span>
                    <input id="momentTitleInput" type="text" class="cm-input" placeholder="Moment name..." />
                </div>
                <span id="momentStartLabel" class="sr-only">0.0s</span>
                <span id="momentEndLabel" class="sr-only">0.0s</span>
                <div class="create-moment-actions">
                    <button id="btnCreateMoment" class="t-btn t-btn-success" type="button" disabled>+ Create Moment</button>
                    <button id="btnDeleteMoment" class="t-btn t-btn-danger" type="button" disabled>Delete</button>
                </div>
            </div>
        </div>

        <div class="timeline-tracks-container" id="timelineTracksContainer">
            <div id="rulerBar" class="ruler-bar"></div>

            <div class="tracks-body" id="tracksBody">
                <!-- Track 1 (Top): Music clip + Start & End Anchors -->
                <div class="track-row">
                    <div class="track-lane" id="musicTrackLane">
                        <canvas id="waveformCanvas" height="38"></canvas>
                        <div id="trimOutsideLeft" class="trim-shade left-shade"></div>
                        <div id="trimOutsideRight" class="trim-shade right-shade"></div>
                        <div id="activeRangeBracket" class="active-range-bracket"></div>

                        <div id="musicStartAnchor" class="timeline-anchor anchor-music" title="Drag Music Start Anchor">
                            <span>[</span>
                        </div>
                        <div id="musicEndAnchor" class="timeline-anchor anchor-music" title="Drag Music End Anchor">
                            <span>]</span>
                        </div>
                    </div>
                </div>

                <!-- Track 2 (Directly below Music, zero gap): Moments clips + Moment Start & End Anchors -->
                <div class="track-row">
                    <div class="track-lane" id="momentsTrackLane">
                        <div id="momentRangePreview" class="moment-range-preview"></div>
                        <div id="momentsOverlay" class="moments-overlay"></div>

                        <div id="momentStartAnchor" class="timeline-anchor anchor-moment"
                            title="Drag Moment Start Anchor">
                            <span>|</span>
                        </div>
                        <div id="momentEndAnchor" class="timeline-anchor anchor-moment" title="Drag Moment End Anchor">
                            <span>|</span>
                        </div>
                    </div>
                </div>

                <!-- Vertical Playhead -->
                <div id="playheadLine" class="playhead-line">
                    <div class="playhead-knob"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="./proDemo/musicStore.js"></script>
    <script src="./proDemo/musicEditor.js"></script>
    <script src="./proDemo/musicPlayer.js"></script>
    <script src="./proDemo/momentEdit.js"></script>
    <script src="./proDemo/synchro.js"></script>
</body>

</html>
