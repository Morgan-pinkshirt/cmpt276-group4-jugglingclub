<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheJestersClub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="moving.css"/>
</head>
<body>
    <h1>The Jesters Club</h1>
    <h1 class="center" id="title">Rotating 2D club</h1>
    <!-- <div id="change" class="changeColor"></div> -->
    <div id="moving" class="model">

        <h2 class="center" id="mode_name">Page 1 - #1 - Rainbow</h2>
        <form class="center"> 
            <fieldset>
                <legend> Choose a mode to preview </legend>
                <select id="options">
                    <optgroup label="Page 1">
                        <option class="page-1" value="p1_1_rainbow">Rainbow</option>
                        <option value="p1_2_rainbow_drops">Rainbow Drops</option>
                        <option value="p1_3_bold">Bold</option>
                        <option value="p1_4_lantern">Lantern</option>
                        <option value="p1_5_fire">Fire</option>
                        <option value="p1_6_water">Water</option>
                        <option value="p1_7_earth">Earth</option>
                        <option value="p1_8_air">Air</option>
                        <option value="p1_9_spirit">Spirit</option>
                        <option value="p1_10_pulse">Pulse</option>
                    </optgroup>
                    <optgroup label="Page 2">
                        <option value="p2_1_candy">Candy</option> <!-- Might need to adjust picture -->
                        <option value="p2_2_petals">Petals</option>
                        <option value="p2_3_love">Love</option>
                        <option value="p2_4_watermelon">Watermelon</option>
                        <option value="p2_5_freedom">Freedom</option>
                        <option value="p2_6_microdots">Microdots</option> <!-- Might need to adjust picture -->
                        <option value="p2_7_unicorn">Unicorn</option>
                        <option value="p2_8_blue_blazer">Blue Blazer</option>
                        <option value="p2_9_solar_flare">Solar Flare</option>
                        <option value="p2_10_strobe">Strobe</option>
                    </optgroup>
                    <optgroup label="Page 3">
                        <option value="p3_1_flamebow">Flamebow</option> <!-- Might need to adjust picture -->
                        <!-- <option value="p3_2_alicorn">Alicorn</option> -->
                        <option value="p3_3_liquid_sugar">Liquid Sugar</option>
                        <option value="p3_4_rainbow_dash">Rainbow Dash</option>
                        <option value="p3_5_fireball">Fireball</option> <!-- Might need to adjust picture -->
                        <option value="p3_6_froth">Froth</option>
                        <!-- <option value="p3_7_jammin">Jammin</option> -->
                        <option value="p3_8_bolder">Bolder</option>
                        <option value="p3_9_sunset">Sunset</option>
                        <option value="p3_10_daybreak">Daybreak</option>
                    </optgroup>
                    <!-- <optgroup label="Page 13">
                        <option value="p13_1_"></option>
                        <option value="p13_2_"></option>
                        <option value="p13_3_"></option>
                        <option value="p13_4_"></option>
                        <option value="p13_5_"></option>
                        <option value="p13_6_"></option>
                        <option value="p13_7_"></option>
                        <option value="p13_8_"></option>
                        <option value="p13_9_"></option>
                        <option value="p13_10_"></option>
                    </optgroup> -->
                </select>
                <input type="button" id="view-button" value="VIEW">
            </fieldset>
        </form>
        <div id="clubDivision">
            <div style="display:none;">
                <img id="img" src="img/p1_1_rainbow.png"/>
            </div>
            <!-- Juggling Club -->
            <svg id="svg_moving" width="120" height="300" viewBox="0 0 120 300">
                <!-- Club Body -->
                <path
                    id="BodyMov"
                    d="M60 20 C20 20 25 100 50 160 L70 160 C95 100 100 20 60 20"
                    fill="grey"/>
                <!-- Club Handle -->
                <rect
                    id ="HandleMov"
                    x="50"
                    y="160"
                    width="20"
                    height="110"
                    fill="white"/>
                <!-- Club Knob (black) -->
                <rect
                    x="47"
                    y="265"
                    width="26"
                    height="15"
                    rx="15"
                    fill="black"/>
            </svg>
            <canvas id="canvas_moving" width="200" height="400">
            
            </canvas>
        </div>
    </div>
    <div id="static" class="model">
        <!-- Shape Selecter -->
        <p>Choose a Club Part</p>
        <button id="bodyButton">Club Body</button>
        <button id="handleButton">Club Handle</button>
        <!-- Colour Slider Bar -->
        <p>Choose a Colour</p>
        <input
            type="range"
            id="colourSlider"
            min="0"
            max="360"
            value="0"
            aria-label="Club colour">
        <p>Drag Slider or Click</p>
        
        <!-- Juggling Club -->
        <svg id="svg_still" width="120" height="300" viewBox="0 0 120 300">
            <!-- Club Body -->
            <path
                id="clubBody"
                d="M60 20 C20 20 25 100 50 160 L70 160 C95 100 100 20 60 20"
                fill="grey"/>
            <!-- Club Handle -->
            <rect
                id ="clubHandle"
                x="50"
                y="160"
                width="20"
                height="110"
                fill="white"/>
            <!-- Club Knob (black) -->
            <rect
                x="47"
                y="265"
                width="26"
                height="15"
                rx="15"
                fill="black"/>
        </svg>
        <canvas id="canvas_still" width="200" height="400">
            
        </canvas>
        
    </div>
    </body>
    <footer>
        <script src="moving.js"></script>
        <script src="script.js"></script>

        <a href="/" class="back-button">Back to Home</a>
    </footer>   
</html>
