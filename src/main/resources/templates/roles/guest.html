
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/midnight-ui :: head('Guest Dashboard')}">
</head>
<body class="mc-page mc-lobby">
    <header th:replace="~{fragments/lobby :: header('guest')}"></header>
    <div class="mc-layout">
        <nav th:replace="~{fragments/lobby :: sidebar('guest')}"></nav>
        <main class="mc-main" id="main">
            <section th:replace="~{fragments/lobby :: hero('guest')}"></section>
            <p class="mc-message"
                role="status"
                th:if="${message != null}"
                th:text="${message}">
            </p>
            <section th:replace="~{fragments/lobby-cards :: guest}"></section>
        </main>
    </div>
    <footer th:replace="~{fragments/midnight-ui :: footer}"></footer>
    <th:block th:replace="~{fragments/midnight-ui :: scripts}"></th:block>
    <script type="module"
            th:src="@{/js/guide-pet/guide-pet-loader.js}">
    </script>
</body>
</html>
