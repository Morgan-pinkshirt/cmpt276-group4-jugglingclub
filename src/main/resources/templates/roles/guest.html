<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/themes/light.css}">
</head>
<body class="guest-page">
    <header>
        <h1>The Jester Club</h1>
        <a class="guest-button guest-login-button" href="/userlogin">Login</a>
    </header>

    <div class="guest-layout">
        <nav class="guest-sidebar">
            <a class="guest-home" href="/home" aria-label="Home">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                    <path fill="currentColor" d="M12 2 2 11h3v10h6v-7h2v7h6V11h3L12 2z"/>
                </svg>
            </a>
        </nav>

        <main class="guest-main">
            <section class="guest-member">
                <div class="guest-panel-content">
                    <h2>Become a Member</h2>
                    <p>Create an account to save your customized settings.</p>
                    <a class="guest-button" href="/userregister">Register</a>
                </div>
            </section>

            <section class="guest-presets">
                <div class="guest-panel-content">
                    <h2>Browse Presets</h2>
                    <div class="guest-preview">Preview Image</div>
                    <a class="guest-button" href="/under-construction">Browse Presets</a>
                </div>
            </section>
        </main>
    </div>

    <footer>
        <p>The Jester Club - CMPT 276 Group 4</p>
    </footer>
</body>
</html>
