<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/themes/{theme}.css(theme=${user.theme})}">
</head>
<body>
    <header>
        <h1>The Jester Club</h1>
        <p>Jester Club Simulator</p>
    </header>

    <nav>
        <a href="/home">Home</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Logout</a>
    </nav>

    <main>

        <section>
            <h2>seurity questions</h2>
        </section>

        <form action="/setquestions" method="POST"> 
        <section>
            <h2>favourite color</h2>
                <label for="favourite color">favourite color:</label>
                <input type="text" name="favcolor" th:value="${user.favcolor}" required>
        </section>
        <section>
            <h2>mother's name</h2>
                <label for="mother's name">mother's name:</label>
                <input type="text" name="mothername" th:value="${user.mothername}" required>
        </section>
        <section>
            <h2>favourite place</h2>
                <label for="favourite place">favourite place:</label>
                <input type="text"  name="favplace" th:value="${user.favplace}" required>
        </section>
        <section>
            <h2>favourite subject</h2>
                <label for="favourite subject">favourite subject:</label>
                <input type="text"  name="favsubject" th:value="${user.favsubject}" required>
        </section>
        <section>
            <h2>hometown</h2>
                <label for="hometown">hometown:</label>
                <input type="text"  name="hometown" th:value="${user.hometown}" required>
        </section>
        <section>
            <h2>favourite game</h2>
                <label for="favourite game">favourite game:</label>
                <input type="text" name="favgame" th:value="${user.favgame}" required>
        </section>
                <input type="submit" value = "update">


        </form>
    </main>

    <footer>
        <p>The Jester Club - CMPT 276 Group 4</p>
    </footer>

</body>
</html>
