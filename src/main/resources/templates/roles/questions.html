<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/themes/{theme}.css(theme=${user.theme})}">
</head>
<body>
    <header>
        <h1>The Jester Club</h1>
        <p>Jester Club Simulator</p>
    </header>

    <nav>
        <a href="/home">Home</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Logout</a>
    </nav>

    <main>

        <section>
            <h2>seurity questions</h2>
        </section>

        <form action="/setquestions" method="POST"> 
        <section>
            <h2>favcolor</h2>
                <label for="favcolor">favcolor:</label>
                <input type="text" name="favcolor" th:value="${user.favcolor}" required>
        </section>
        <section>
            <h2>mothername</h2>
                <label for="mothername">mothername:</label>
                <input type="text" name="mothername" th:value="${user.mothername}" required>
        </section>
        <section>
            <h2>favplace</h2>
                <label for="favplace">favplace:</label>
                <input type="text"  name="favplace" th:value="${user.favplace}" required>
        </section>
        <section>
            <h2>favsubject</h2>
                <label for="favsubject">favsubject:</label>
                <input type="text"  name="favsubject" th:value="${user.favsubject}" required>
        </section>
        <section>
            <h2>hometown</h2>
                <label for="hometown">hometown:</label>
                <input type="text"  name="hometown" th:value="${user.hometown}" required>
        </section>
        <section>
            <h2>favgame</h2>
                <label for="favgame">favgame:</label>
                <input type="text" name="favgame" th:value="${user.favgame}" required>
        </section>
                <input type="submit" value = "update">


        </form>
    </main>

    <footer>
        <p>The Jester Club - CMPT 276 Group 4</p>
    </footer>

</body>
</html>
