<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Questions | The Jester Club</title>
    <link rel="stylesheet" th:href="@{/css/midnight-circus-theme.css}">
    <link rel="stylesheet" th:href="@{/css/midnight-settings.css}">
</head>
<body class="mc-page mc-settings">
    <header class="mc-header">
        <a th:replace="~{fragments/midnight-ui :: brand}"></a>
        <nav class="mc-settings-nav">
            <a class="mc-button mc-outline" th:href="@{/settings}">
                <i data-lucide="arrow-left"></i>
                Back to Settings
            </a>
            <a class="mc-button mc-outline" th:href="@{/logout}">
                <i data-lucide="log-out"></i>
                Sign Out
            </a>
        </nav>
    </header>
    <main class="mc-settings-main" id="main">
        <section class="mc-login-panel mc-settings-secondary-wide">
            <div class="mc-settings-panel-icon">
                <i data-lucide="shield-check"></i>
            </div>
            <h2>Security Questions</h2>
            <p>
                Manage your security answers for account recovery
            </p>
            <div class="mc-notice mc-notice-info">
                <i data-lucide="info"></i>
                <span>
                    Existing answers are shown below.
                    Leave a field blank to keep its current answer.
                </span>
            </div>
            <form class="mc-questions-form" action="/setquestions" method="post">
                <div class="mc-notice mc-notice-error"
                    th:if="${error}"
                    role="alert">
                    <i data-lucide="circle-alert"></i>
                    <span th:text="${error}"></span>
                </div>
                <div class="mc-settings-question-grid">
                    <div th:replace="~{fragments/auth :: field(
                        'favcolor',
                        'Favourite Colour',
                        'text',
                        'palette',
                        'Enter your answer',
                        ${user.favcolor},
                        false
                    )}">
                    </div>
                    <div th:replace="~{fragments/auth :: field(
                        'mothername',
                        'Name of your mother',
                        'text',
                        'user-round',
                        'Enter your answer',
                        ${user.mothername},
                        false
                    )}">
                    </div>
                    <div th:replace="~{fragments/auth :: field(
                        'favplace',
                        'Favourite Place',
                        'text',
                        'map-pin',
                        'Enter your answer',
                        ${user.favplace},
                        false
                    )}">
                    </div>
                    <div th:replace="~{fragments/auth :: field(
                        'favsubject',
                        'Favourite Subject',
                        'text',
                        'book-open',
                        'Enter your answer',
                        ${user.favsubject},
                        false
                    )}">
                    </div>
                    <div th:replace="~{fragments/auth :: field(
                        'hometown',
                        'Hometown',
                        'text',
                        'house',
                        'Enter your answer',
                        ${user.hometown},
                        false
                    )}">
                    </div>
                    <div th:replace="~{fragments/auth :: field(
                        'favgame',
                        'Favourite Game',
                        'text',
                        'gamepad-2',
                        'Enter your answer',
                        ${user.favgame},
                        false
                    )}">
                    </div>
                </div>
                <div class="mc-settings-panel-actions">
                    <a class="mc-button mc-outline" th:href="@{/settings}">
                        <i data-lucide="arrow-left"></i>
                        Cancel
                    </a>
                    <button type="submit" class="mc-button">
                        <i data-lucide="save"></i>
                        Save Answers
                    </button>
                </div>
            </form>
        </section>
    </main>
    <footer th:replace="~{fragments/midnight-ui :: footer}"></footer>
    <th:block th:replace="~{fragments/midnight-ui :: scripts}"></th:block>
</body>
</html>
