<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Questions - The Jester Club</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/themes/{theme}.css(theme=${user.theme})}">
</head>
<body class="settings-page">
    <header>
        <h1>The Jester Club</h1>
        <p>Jester Club Simulator</p>
    </header>

    <nav>
        <a href="/home">Home</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Logout</a>
    </nav>

    <main>
        <section>
            <h2>Security Questions</h2>
            <p>Existing answers are shown below. Leave a field blank to keep its current answer.</p>
            <p th:if="${error}" th:text="${error}"></p>

            <form action="/setquestions" method="post"
                  style="display: flex; flex-direction: column; gap: 16px;">
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="favcolor">Favourite Color:</label>
                    <input type="text" id="favcolor" name="favcolor" th:value="${user.favcolor}">
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="mothername">Mother's Name:</label>
                    <input type="text" id="mothername" name="mothername" th:value="${user.mothername}">
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="favplace">Favourite Place:</label>
                    <input type="text" id="favplace" name="favplace" th:value="${user.favplace}">
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="favsubject">Favourite Subject:</label>
                    <input type="text" id="favsubject" name="favsubject" th:value="${user.favsubject}">
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="hometown">Hometown:</label>
                    <input type="text" id="hometown" name="hometown" th:value="${user.hometown}">
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="favgame">Favourite Game:</label>
                    <input type="text" id="favgame" name="favgame" th:value="${user.favgame}">
                </div>
                <button type="submit">Update</button>
            </form>
        </section>
    </main>

    <footer>
        <p>The Jester Club - CMPT 276 Group 4</p>
    </footer>
</body>
</html>
