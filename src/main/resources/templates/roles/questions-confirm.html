<!DOCTYPE html>
<html lang="en"
        xmlns:th="http://www.thymeleaf.org"
        th:replace="~{fragments/auth :: layout(
            'Confirm Password',
            ~{::section}
        )}">>
<body>
    <section class="mc-login-panel mc-result-panel">
        <div class="mc-result-icon">
            <i data-lucide="shield-check"></i>
        </div>
        <h2>Confirm Password</h2>
        <p>
            Verify your identity before accessing
            your security questions.
        </p>
        <form th:action="@{/securityquestions/confirm}" method="post">
            <div th:replace="~{fragments/auth :: password(
                'currentPassword',
                'Current Password',
                'current-password'
            )}">
            </div>
            <button type="submit" class="mc-button">
                <i data-lucide="shield-check"></i>
                Confirm Identity
            </button>
        </form>
        <div class="mc-auth-back">
            <a th:href="@{/settings}">
                <i data-lucide="arrow-left"></i>
                Back to Settings
            </a>
        </div>
    </section>
</body>
</html>
