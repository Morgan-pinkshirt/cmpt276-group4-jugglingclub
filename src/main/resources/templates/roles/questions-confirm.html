<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Password - The Jester Club</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/themes/{theme}.css(theme=${user.theme})}">
</head>
<body class="login-page">
    <div class="login-layout">
        <header>
            <h1>The Jester Club</h1>
        </header>
        <main>
            <section class="login-panel">
                <h2>View Security Questions</h2>
                <p>Confirm your current password to continue.</p>
                <form th:action="@{/securityquestions/confirm}" method="post">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" name="currentPassword" required>
                    <button type="submit">Confirm</button>
                </form>
                <div class="login-links">
                    <a th:href="@{/settings}">Back to Settings</a>
                </div>
            </section>
        </main>
        <footer>
            <p>The Jester Club - CMPT 276 Group 4</p>
        </footer>
    </div>
</body>
</html>
