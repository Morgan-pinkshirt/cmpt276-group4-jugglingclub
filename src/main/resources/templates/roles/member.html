<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/midnight-ui :: head('Member Dashboard')}">
</head>
<body class="mc-page mc-lobby">
    <header th:replace="~{fragments/lobby :: header('member')}"></header>
    <div class="mc-layout">
        <nav th:replace="~{fragments/lobby :: sidebar('member')}"></nav>
        <main class="mc-main" id="main">
            <section th:replace="~{fragments/lobby :: hero('member')}"> </section>
            <p class="mc-message"
                role="status"
                th:if="${message != null}"
                th:text="${message}">
            </p>
            <section th:replace="~{fragments/lobby-cards :: creative}"></section>
            <section th:replace="~{fragments/lobby-cards :: presets}"></section>
            <section th:replace="~{fragments/lobby-cards :: templates}"></section>
            <p class="mc-status"
                id="mc-status"
                role="status">
            </p>
        </main>
    </div>
    <footer th:replace="~{fragments/midnight-ui :: footer}"></footer>
    <th:block th:replace="~{fragments/midnight-ui :: scripts}"></th:block>
    <script defer th:src="@{/js/midnight-lobby.js}"></script>
    <script type="module"
        th:src="@{/js/guide-pet/guide-pet-loader.js}">
    </script>
</body>
</html>
