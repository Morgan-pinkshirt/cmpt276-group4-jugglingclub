<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
                th:with=" isSuperAdmin=${currentRole != null 
                        and currentRole.name() == 'SUPER_ADMIN'},
                        lobbyRole=${isSuperAdmin
                        ? 'super_admin'
                        : 'admin'},
                        pageTitle=${isSuperAdmin
                        ? 'Super Admin Dashboard'
                        : 'Admin Dashboard'}">
<head th:replace="~{fragments/midnight-ui :: head(${pageTitle})}">
</head>
<body class="mc-page mc-lobby">
    <header th:replace="~{fragments/lobby :: header(${lobbyRole})}"></header>
    <div class="mc-layout">
        <nav th:replace="~{fragments/lobby :: sidebar(${lobbyRole})}"></nav>
        <main class="mc-main" id="main">
            <section th:replace="~{fragments/lobby :: hero(${lobbyRole})}"></section>
            <p class="mc-message"
                role="status"
                th:if="${message != null}"
                th:text="${message}">
            </p>
            <section th:replace="~{fragments/lobby-cards :: creative}"></section>
            <section th:replace="~{fragments/lobby-cards :: presets}"></section>
            <section th:replace="~{fragments/lobby-cards :: templates}"></section>
            <section th:replace="~{fragments/lobby-cards :: administration}"></section>
            <p class="mc-status"
                id="mc-status"
                role="status">
            </p>
        </main>
    </div>
    <footer th:replace="~{fragments/midnight-ui :: footer}"></footer>
    <th:block th:replace="~{fragments/midnight-ui :: scripts}"></th:block>
    <script defer th:src="@{/js/midnight-lobby.js}"></script>
</body>
</html>
