<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Accounts</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/themes/{theme}.css(theme=${theme})}">
</head>
<body class="member-page view-accounts-page">
    <header>
        <h1>The Jester Club</h1>
        <a class="member-button member-logout-button" href="/logout">Logout</a>
    </header>

    <div class="member-layout">
        <nav class="member-sidebar">
            <a class="member-home" href="/home" aria-label="Home">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                    <path fill="currentColor" d="M12 2 2 11h3v10h6v-7h2v7h6V11h3L12 2z"/>
                </svg>
            </a>

            <a class="member-settings" href="/settings" aria-label="Settings">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                    <path fill="currentColor" fill-rule="evenodd" d="M9.7 4.5 L10.2 2.1 L13.8 2.1 L14.3 4.5 L15.6 5.1 L17.7 3.7 L20.3 6.3 L18.9 8.4 L19.5 9.7 L21.9 10.2 L21.9 13.8 L19.5 14.3 L18.9 15.6 L20.3 17.7 L17.7 20.3 L15.6 18.9 L14.3 19.5 L13.8 21.9 L10.2 21.9 L9.7 19.5 L8.4 18.9 L6.3 3.7 L3.7 6.3 L5.1 8.4 L4.5 9.7 L2.1 10.2 L2.1 13.8 L4.5 14.3 L5.1 15.6 L3.7 17.7 L6.3 20.3 L8.4 18.9 L9.7 19.5Z M15 12a3 3 0 1 0-6 0a3 3 0 1 0 6 0Z"/>
                </svg>
            </a>
        </nav>

        <main class="view-accounts-main">
            <section class="view-accounts-panel">
                <h2>Account Management</h2>

                <table class="accounts-table">
                    <thead>
                        <tr>
                            <th>UID</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="account : ${accounts}">
                            <td th:text="${account.uid}">1</td>
                            <td th:text="${account.name}">Username</td>
                            <td th:text="${account.role}">MEMBER</td>
                            <td>
                                <form th:if="${account.uid != currentUid}" th:action="@{/admin/accounts/delete}" method="post" onsubmit="return confirm('Are you sure you want to delete this account?');">
                                    <input type="hidden" name="uid" th:value="${account.uid}">
                                    <button class="member-button" type="submit">Delete</button>
                                </form>
                                <span th:if="${account.uid == currentUid}">Current Account</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(accounts)}">
                            <td colspan="4">No accounts found.</td>
                        </tr>
                    </tbody>
                </table>

                <a class="member-button" href="/home">Back to Home</a>
            </section>
        </main>
    </div>

    <footer>
        <p>The Jester Club - CMPT 276 Group 4</p>
    </footer>
</body>
</html>
