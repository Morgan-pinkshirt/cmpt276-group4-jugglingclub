<!DOCTYPE html>
<html lang="en"
        xmlns:th="http://www.thymeleaf.org"
        th:replace="~{fragments/auth :: layout(
        'Create Trickster',
        ~{::section}
    )}">
<body>
<section class="mc-login-panel mc-result-panel">
    <div class="mc-result-icon">
        <i data-lucide="shield-plus"></i>
    </div>
    <h2>Create Trickster (Admin)</h2>
    <p class="mc-auth-description">
        Welcome a new Trickster to the administration
        team of The Jesters Club.
    </p>
    <form id="login" th:action="@{/admin/create}" method="post">
        <div class="mc-auth-field">
            <label for="username">
                Username
            </label>
            <div class="mc-input-wrap">
                <i data-lucide="user-round" class="mc-input-icon"></i>
                <input type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="off"
                        required>
            </div>
        </div>
        <div th:replace="~{fragments/auth :: password(
            'password',
            'Password',
            'new-password'
        )}">
        </div>
        <th:block th:if="${message != null}">
            <div th:replace="~{fragments/auth :: notice(
                'error',
                'circle-alert',
                ${message}
            )}">
            </div>
        </th:block>
        <button type="submit" class="mc-button">
            <i data-lucide="shield-plus"></i>
            Create Trickster (Admin)
        </button>
    </form>
    <div class="mc-auth-back">
        <a th:href="@{/admin/accounts}">
            <i data-lucide="arrow-left"></i>
            Back to Account Management
        </a>
    </div>
    <div class="mc-auth-back">
        <a th:href="@{/home}">
            <i data-lucide="house"></i>
            Back to Lobby
        </a>
    </div>
</section>
</body>
</html>
