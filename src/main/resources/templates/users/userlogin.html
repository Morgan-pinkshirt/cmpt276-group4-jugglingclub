<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link id="login-theme-stylesheet"
          rel="stylesheet"
          th:href="@{/css/themes/purple.css}">

    <script th:src="@{/index.js}" defer></script>
</head>

<body class="login-page">
    <div class="login-layout">

        <header>
            <h1>The Jester Club</h1>
        </header>

        <main>
            <section class="login-panel">
                <h2>Sign In</h2>

                <form action="/userlogin"
                      id="login"
                      method="post">

                    <label for="username">Username</label>

                    <input id="username"
                           type="text"
                           name="username"
                           required>
                    
                    <label for="password">Password</label>

                    <input id="password"
                           type="password"
                           name="password"
                           required>
                    <div th:text="${message}" style = "color: red;"></div>
                    <button type="submit">Login</button>
                </form>

                <div class="login-links">
                    <a href="/createaccount">Register</a>
                    <a href="/logout">Continue as Guest</a>
                </div>

                <form action="/forgot-password" method="get">
                    <button type="submit">Forgot Password?</button>
                </form>
            </section>
        </main>

        <footer>
            <p>The Jester Club - CMPT 276 Group 4</p>
        </footer>

    </div>

</body>
</html>
