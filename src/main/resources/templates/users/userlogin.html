<!DOCTYPE html>
<html lang="en"
        xmlns:th="http://www.thymeleaf.org"
        th:replace="~{fragments/auth :: layout(
            'Login',
            ~{::section}
        )}">
    <body>
        <section class="mc-login-panel">
            <h2 id="sign-in-title">Sign In</h2>
            <p class="mc-auth-description">
                Your creative stage awaits.
            </p>
            <form id="login"
                th:action="@{/userlogin}"
                method="post">
                <div class="mc-auth-field">
                    <label for="username">
                        Username
                    </label>
                    <div class="mc-input-wrap">
                        <i data-lucide="user-round"
                            class="mc-input-icon"></i>
                        <input id="username"
                                name="username"
                                type="text"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required>
                    </div>
                </div>
                <div th:replace="~{fragments/auth :: password(
                    'password',
                    'Password',
                    'current-password'
                )}"></div>
                <button class="mc-button mc-auth-action" type="submit">
                    <i data-lucide="log-in"></i>
                    Sign In
                </button>
            </form>
            <a class="mc-forgot" th:href="@{/forgot-password}">
                <i data-lucide="key-round"></i>
                Forgot password?
            </a>
            <div class="mc-login-divider">
                New to the club?
            </div>
            <div class="mc-login-links">
        
                <a class="mc-button mc-outline" th:href="@{/createaccount}">
                    <i data-lucide="user-plus"></i>
                    Register
                </a>
                <a class="mc-button mc-outline"th:href="@{/logout}">
                    <i data-lucide="user-round"></i>
                    Continue as guest
                </a>
            </div>
        </section>
    </body>
</html>
