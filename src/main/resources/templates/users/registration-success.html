<!DOCTYPE html>
<html lang="en"
        xmlns:th="http://www.thymeleaf.org"
        th:replace="~{fragments/auth :: layout(
                    'Account Created',
                    ~{::section}
                    )}">
<body>
<section class="mc-login-panel mc-result-panel">
    <div class="mc-result-icon mc-result-success">
        <i data-lucide="circle-check"></i>
    </div>
    <h2 id="success-title">
        Welcome to the Club!
    </h2>
    <p class="mc-auth-description">
        Your account has been created successfully.
        Your creative stage is waiting.
    </p>
    <div th:replace="~{fragments/auth :: notice(
        'success',
        'check-circle',
        'Account created successfully!'
    )}"></div>
    <div class="mc-result-actions">
        <a class="mc-button" th:href="@{/userlogin}">
            <i data-lucide="log-in"></i>
            Sign In
        </a>
        <a class="mc-button mc-outline" th:href="@{/home}">
            <i data-lucide="house"></i>
            Back to Lobby
        </a>
    </div>
</section>
</body>
</html>
