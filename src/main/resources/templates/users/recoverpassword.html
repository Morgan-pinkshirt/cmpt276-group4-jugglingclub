<!DOCTYPE html>
<html lang="en"
        xmlns:th="http://www.thymeleaf.org"
        th:replace="~{fragments/auth :: layout(
                    'Security Question',
                    ~{::section}
                    )}">
<body>
<section class="mc-login-panel mc-recovery-panel">
    <div class="mc-result-icon">
        <i data-lucide="shield-question"></i>
    </div>
    <h2 id="question-title">
        Verify Your Identity
    </h2>
    <p class="mc-auth-description">
        Answer your security question to
        continue recovering your account.
    </p>
    <div class="mc-notice mc-notice-info">
        <i data-lucide="shield-check"></i>
        <span th:text="${message}">
            Your security question
        </span>
    </div>
    <form th:action="@{/secureanswer}"
        method="post"
        style="margin-top: 20px;">
        <input type="hidden"
                name="question"
                th:value="${question}">
        <input type="hidden"
                name="username"
                th:value="${username}">
        <div th:replace="~{fragments/auth :: field(
            'answer',
            'Your Answer',
            'text',
            'message-circle',
            'Enter your answer',
            ${null},
            true
        )}">
        </div>
        <button class="mc-button mc-auth-action" type="submit">
            <i data-lucide="arrow-right"></i>
            Verify Answer
        </button>
    </form>
    <a class="mc-forgot" th:href="@{/forgot-password}">
        <i data-lucide="refresh-cw"></i>
        Try another recovery method
    </a>
    <div th:replace="~{fragments/auth :: backToLogin}"></div>
</section>
</body>
</html>
