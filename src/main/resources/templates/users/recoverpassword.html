<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/themes/light.css}">
</head>
<body class="login-page">
    <div class="login-layout">
        <header>
            <h1>The Jester Club</h1>
        </header>

        <main>
            <section class="login-panel">
                <h2><span th:text="${message}">security question here</span></h2>
                <form action="/secureanswer" method="post">
                    <input type="hidden" name="question" th:value="${question}">
                    <input type="hidden" name="username" th:value="${username}">
                    <input type="text" name="answer" required>
                    <input type="submit" value="submit">


                </form>
                

                <div class="login-links">
                    <a href="/userlogin">Back to Login</a>
                </div>
            </section>
        </main>

        <footer>
            <p>The Jester Club - CMPT 276 Group 4</p>
        </footer>
    </div>
</body>
</html>
