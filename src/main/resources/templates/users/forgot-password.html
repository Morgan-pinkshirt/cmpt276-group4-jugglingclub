<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - The Jester Club</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/themes/light.css}">
</head>

<body class="login-page">

    <div class="login-layout">

        <header>
            <h1>The Jester Club</h1>
        </header>

        <main>
            <section class="login-panel">

                <h2>Forgot Password</h2>

                <h3>Recover by Email</h3>

                <form th:action="@{/forgot-password/email}"
                      method="post">

                    <label for="email">Email Address</label>

                    <input type="email"
                           id="email"
                           name="email"
                           required>

                    <button type="submit">
                        Send Reset Link
                    </button>
                </form>

                <h3>Recover by Security Questions</h3>

                <form th:action="@{/answersecure}"
                      method="post">
                    <label for="username">Username</label>
                    <input type="text"
                           id="username"
                           name="username"
                           required>
                    <button type="submit">
                        Answer Security Question
                    </button>
                </form>

                <div class="login-links">
                    <a th:href="@{/userlogin}">
                        Back to Login
                    </a>
                </div>

            </section>
        </main>

        <footer>
            <p>The Jester Club - CMPT 276 Group 4</p>
        </footer>

    </div>

</body>
</html>
