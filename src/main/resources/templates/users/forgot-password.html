<!DOCTYPE html>
<html lang="en"
        xmlns:th="http://www.thymeleaf.org"
        th:replace="~{fragments/auth :: layout(
            'Forgot Password',
            ~{::section}
        )}">>
    <body>
        <section class="mc-login-panel mc-recovery-panel">
            <div class="mc-result-icon">
                <i data-lucide="key-round"></i>
            </div>
            <h2 id="recovery-title">
                Forgot Password?
            </h2>
            <p class="mc-auth-description">
                Choose how you would like to
                recover your account.
            </p>
            <div class="mc-recovery-method">
                <h3>
                    <i data-lucide="mail"></i>
                    Recover by Email
                </h3>
                <p>
                    Request a password reset link
                    using your account email address.
                </p>
                <form th:action="@{/forgot-password/email}"method="post">
                    <div th:replace="~{fragments/auth :: field(
                        'email',
                        'Email Address',
                        'email',
                        'mail',
                        'Enter your email address',
                        ${email},
                        true
                    )}"></div>
                    <th:block th:if="${emailError != null}">
                        <div th:replace="~{fragments/auth :: notice(
                            'error',
                            'circle-alert',
                            ${emailError}
                        )}"></div>
                    </th:block>
                    <button class="mc-button mc-auth-action"
                            type="submit">
                        <i data-lucide="send"></i>
                        Send Reset Link
                    </button>
                </form>
            </div>
            <hr class="mc-auth-divider">
            <div class="mc-recovery-method">
                <h3>
                    <i data-lucide="shield-question"></i>
                    Recover by Security Questions
                </h3>
                <p>
                    Answer a security question
                    associated with your account.
                </p>
                <form th:action="@{/answersecure}" method="post">
                    <div th:replace="~{fragments/auth :: field(
                        'username',
                        'Username',
                        'text',
                        'user-round',
                        'Enter your username',
                        ${null},
                        true
                    )}"></div>
                    <button class="mc-button mc-auth-action" type="submit">
                        <i data-lucide="shield-check"></i>
                        Answer Security Question
                    </button>
                </form>
            </div>
            <div th:replace="~{fragments/auth :: backToLogin}"></div>
        </section>
    </body>
</html>
