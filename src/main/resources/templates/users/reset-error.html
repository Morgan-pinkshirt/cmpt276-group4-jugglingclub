<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Reset Error - The Jester Club</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/themes/light.css}">
</head>

<body class="login-page">
    <div class="login-layout">

        <header>
            <h1>The Jester Club</h1>
        </header>

        <main>
            <section class="login-panel">

                <h2>Password Reset Failed</h2>

                <p th:text="${message}">
                    Passwords do not match.
                </p>

                <form th:action="@{/reset-password}"
                      method="get">

                    <input type="hidden"
                           name="token"
                           th:value="${token}">

                    <button type="submit">
                        Try Again
                    </button>
                </form>

                <div class="login-links">
                    <a th:href="@{/userlogin}">
                        Back to Login
                    </a>
                </div>

            </section>
        </main>

        <footer>
            <p>The Jester Club - CMPT 276 Group 4</p>
        </footer>

    </div>
</body>
</html>
