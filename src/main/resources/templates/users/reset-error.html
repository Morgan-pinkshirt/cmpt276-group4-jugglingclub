<!DOCTYPE html>
<html lang="en"
        xmlns:th="http://www.thymeleaf.org"
        th:replace="~{fragments/auth :: layout(
                    'Password Reset Error',
                    ~{::section}
                    )}">
<body>
<section class="mc-login-panel mc-result-panel">
    <div class="mc-result-icon mc-result-error">
        <i data-lucide="circle-alert"></i>
    </div>
    <h2 id="error-title">
        Password Reset Failed
    </h2>
    <p class="mc-auth-description">
        We couldn't reset your password.
        Please review the message below.
    </p>
    <div th:replace="~{fragments/auth :: notice(
        'error',
        'alert-circle',
        ${message}
    )}">
    </div>
    <div class="mc-result-actions">
        <form th:action="@{/reset-password}"
                method="get"
                th:if="${token != null}">
            <input type="hidden"
                    name="token"
                    th:value="${token}">
            <button class="mc-button mc-auth-action"
                    type="submit">
                <i data-lucide="refresh-cw"></i>
                Try Again
            </button>
        </form>
        <a class="mc-button mc-outline" th:href="@{/forgot-password}">
            <i data-lucide="key-round"></i>
            Request Another Reset
        </a>
    </div>
    <div th:replace="~{fragments/auth :: backToLogin}"></div>
</section>
</body>
</html>
