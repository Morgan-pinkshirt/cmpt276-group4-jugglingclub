<!DOCTYPE html>
<html lang="en"
        xmlns:th="http://www.thymeleaf.org"
        th:replace="~{fragments/auth :: layout(
                    'Reset Password',
                    ~{::section}
                    )}">
<body>
<section class="mc-login-panel">
    <div class="mc-result-icon">
        <i data-lucide="lock-keyhole"></i>
    </div>
    <h2 id="reset-title">
        Reset Password
    </h2>
    <p class="mc-auth-description">
        Create a new password to regain
        access to your account.
    </p>
    <form th:action="@{/reset-password}" method="post">
        <input type="hidden"
                name="token"
                th:value="${token}">
        <div th:replace="~{fragments/auth :: password(
            'password',
            'New Password',
            'new-password'
        )}">
        </div>
        <div th:replace="~{fragments/auth :: password(
            'confirmPassword',
            'Confirm New Password',
            'new-password'
        )}">
        </div>
        <button class="mc-button mc-auth-action" type="submit">
            <i data-lucide="lock-keyhole"></i>
            Reset Password
        </button>
    </form>
    <div th:replace="~{fragments/auth :: backToLogin}"></div>
</section>
</body>
</html>
