<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - The Jester Club</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/themes/light.css}">
</head>

<body class="login-page">

    <div class="login-layout">

        <header>
            <h1>The Jester Club</h1>
        </header>

        <main>
            <section class="login-panel">

                <h2>Reset Password</h2>

                <p>Enter your new password below.</p>

                <form th:action="@{/reset-password}"
                      method="post">

                    <input type="hidden"
                           name="token"
                           th:value="${token}">

                    <label for="password">
                        New Password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           required>

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           required>

                    <button type="submit">
                        Reset Password
                    </button>
                </form>

                <div class="login-links">
                    <a th:href="@{/userlogin}">
                        Back to Login
                    </a>
                </div>

            </section>
        </main>

        <footer>
            <p>The Jester Club - CMPT 276 Group 4</p>
        </footer>

    </div>

</body>
</html>
