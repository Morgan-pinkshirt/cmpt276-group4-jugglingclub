<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View saved projects</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/themes/{theme}.css(theme=${theme})}">
</head>
<body class="member-page view-accounts-page">
    <header>
        <h1>The Jester Club</h1>
        <a class="member-button member-logout-button" href="/logout">Logout</a>
    </header>

    <div class="member-layout">
        <nav class="member-sidebar">
            <a class="member-home" href="/home" aria-label="Home">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                    <path fill="currentColor" d="M12 2 2 11h3v10h6v-7h2v7h6V11h3L12 2z"/>
                </svg>
            </a>

            <a class="member-settings" href="/settings" aria-label="Settings">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                    <path fill="currentColor" fill-rule="evenodd" d="M9.7 4.5 L10.2 2.1 L13.8 2.1 L14.3 4.5 L15.6 5.1 L17.7 3.7 L20.3 6.3 L18.9 8.4 L19.5 9.7 L21.9 10.2 L21.9 13.8 L19.5 14.3 L18.9 15.6 L20.3 17.7 L17.7 20.3 L15.6 18.9 L14.3 19.5 L13.8 21.9 L10.2 21.9 L9.7 19.5 L8.4 18.9 L6.3 3.7 L3.7 6.3 L5.1 8.4 L4.5 9.7 L2.1 10.2 L2.1 13.8 L4.5 14.3 L5.1 15.6 L3.7 17.7 L6.3 20.3 L8.4 18.9 L9.7 19.5Z M15 12a3 3 0 1 0-6 0a3 3 0 1 0 6 0Z"/>
                </svg>
            </a>
        </nav>

        <main class="view-accounts-main">
            <section class="view-accounts-panel">
                <h2>Saved Projects</h2>

                <table class="accounts-table">
                    <thead>
                        <tr>
                            <th>UID</th>
                            <th>Project Name</th>
                            <th>Edit</th>
                            <th>Export</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="project : ${projects}">
                            <td th:text="${project.uid}">1</td>
                            <td th:text="${project.projectname}">projectname</td>
                            <td>
                                <form th:action="@{/customsave}" method="post">
                                    <input type="hidden" name="UID" th:value="${project.uid}">
                                    <button class="member-button" type="submit">Edit</button>
                                </form>
                            </td>
                            <td>
                                <a class="member-button"
                                   th:href="@{/exportproject(UID=${project.uid})}">Export</a>
                            </td>
                            <td>
                                <form th:action="@{/deleteproject}" method="post" onsubmit="return confirm('Are you sure you want to delete this project?');">
                                    <input type="hidden" name="UID" th:value="${project.uid}">
                                    <button class="member-button" type="submit">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(projects)}">
                            <td colspan="5">No projects found.</td>
                        </tr>
                    </tbody>
                </table>

                <h3>Import Project</h3>

                <form th:action="@{/importproject}" method="post" enctype="multipart/form-data">
                    <input type="file"
                           id="importFile"
                           name="file"
                           accept=".json,application/json"
                           style="display: none;">

                    <button class="member-button"
                            type="button"
                            id="chooseFileButton">Choose File</button>

                    <span id="selectedFileName" style="margin: 0 12px;">No file selected</span>

                    <button class="member-button" type="submit">Import</button>
                </form>

                <p th:if="${importMessage}" th:text="${importMessage}"></p>

                <a class="member-button" href="/home">Back to Home</a>
            </section>
        </main>
    </div>

    <footer>
        <p>The Jester Club - CMPT 276 Group 4</p>
    </footer>

    <script>
        const importFile = document.getElementById("importFile");
        const chooseFileButton = document.getElementById("chooseFileButton");
        const selectedFileName = document.getElementById("selectedFileName");

        chooseFileButton.addEventListener("click", function() {
            importFile.click();
        });

        importFile.addEventListener("change", function() {
            if (importFile.files.length > 0) {
                selectedFileName.textContent = importFile.files[0].name;
            } else {
                selectedFileName.textContent = "No file selected";
            }
        });
    </script>
</body>
</html>
