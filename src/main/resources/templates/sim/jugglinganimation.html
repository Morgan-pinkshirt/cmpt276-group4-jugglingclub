<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" th:href="@{/2d-sim/style.css}">
    <link rel="stylesheet" th:href="@{/2d-sim/moving.css}">
    <link rel="stylesheet" th:href="@{/2d-sim/sim.css}">
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer>
    </script>

  <meta charset="UTF-8">
  <style>
    @keyframes juggle-slide {
      100% { transform: translateX(200px); }
    }
    @keyframes juggle-arc {
      0% { transform: rotate(0deg) translateX(200px) rotate(0deg); }
      100% { transform: rotate(-180deg) translateX(200px) rotate(180deg); }
    }
    @keyframes juggle-arc2{
      0% { transform: rotate(0deg) translateX(0px); }
      100% { transform: rotate(-180deg) translateX(400px); }

    }
    @keyframes hand-up{
      0% {transform: rotate(-20deg);}
      50% {transform: rotate(-10deg);}
      100% {transform: rotate(-20deg);}
    }
    @keyframes hand-left{
      0% {transform: rotate(20deg);}
      50% {transform: rotate(10deg);}
      100% {transform: rotate(20deg);}
    }
    @keyframes spin{
      0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
    }
    .lefthand{
      transform-origin: 390px 375px;
      animation: hand-left 1s linear infinite;
    }
    .righthand{
      transform-origin: 600px 375px;
      animation: hand-up 1s linear infinite;
    }
    .ball-slide {
      animation: juggle-slide 1s  linear infinite;
    }
    .ball-slide2 {
      animation: juggle-slide2 1s  linear infinite;
    }
    .ball-arc {
      transform-origin: 700px 500px;
      animation: juggle-arc 1s linear infinite;
    }
    svg {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevents scrollbars if needed */
    }

 </style>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Simulation | TheJestersClub</title>
    <base th:href="@{/2d-sim/}" href="/2d-sim/">
    <link rel="stylesheet" th:href="@{/2d-sim/style.css}">
    <link rel="stylesheet" th:href="@{/2d-sim/moving.css}">
    <link rel="stylesheet" th:href="@{/2d-sim/sim.css}">
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer>
    </script>

  
</head>
<body>
    <!-- <svg width="200" height="100">
      <circle class="ball-slide" cx="30" cy="50" r="10" fill="#ff6d00"/>
      <circle class="ball-slide" cx="70" cy="50" r="10" fill="#f03355"/>

 <div class="studio-shell">
        <header class="studio-header">
            <div class="brand">
                <i data-lucide="drama"></i>
                <span>The Jesters Club</span>
            </div>

            <!-- Navigation Buttons -->
            <div style="display: flex; gap: 10px; align-items: center;">
                <!-- onclick added so the current state is saved before navigating to the 3D simulator -->

                <a th:href="@{/viewsavedprojects}" href="/viewsavedprojects" class="back-button"
                    style="background: #2563eb; color: white; border-color: #2563eb;">
                    <i data-lucide="box"></i>
                    <span>My Products</span>
                </a>

                <a th:href="@{/home}" class="back-button">
                    <i data-lucide="arrow-left"></i>
                    <span>Back to Home</span>
                </a>
            </div>
        </header>
        <main>
            <svg viewBox="0 0 1000 1000" preserveAspectRatio="none">
                <circle cx="500" cy="250" r="100" fill="red"/>
                <rect height="600" width="200" x="400" y="350" fill="blue"/>
                <rect class="lefthand " height="320" width="10" x="390" y="375" fill="purple"/>
                <rect class="righthand " height="320" width="10" x="600" y="375" fill="purple"/>

                
                <circle class="ball-slide" cx="300" cy="700" r="10" fill="#ff6d00"/>
                <circle class="ball-slide" cx="500" cy="700" r="10" fill="#f03355"/>
                <circle class="ball-arc" cx="500" cy="700" r="10" fill="#fa3355"/>
            </svg>
           </main>
          </body>
           <script th:inline="javascript">
        (function () {
            const serverSave = /*[[${currentSave}]]*/ null;

            if (serverSave) {
                console.log("Loaded saved project from DB into 2D:", serverSave);

                // 1. Get raw values from DB (defaults to 1 if null)
                let rawBrightness = serverSave.brightness ? Number(serverSave.brightness) : 1;
                let rawSaturation = serverSave.saturation ? Number(serverSave.saturation) : 1;

                // If stored in 3D scale (<= 2), calculate UI percentage (0-100) and rendering scale (0-2)
                let uiBrightness = rawBrightness <= 2 ? rawBrightness * 100 : rawBrightness;
                let uiSaturation = rawSaturation <= 2 ? rawSaturation * 100 : rawSaturation;

                // Package into 2D expected structure
                const tempSelectionData = {
                    UID: serverSave.uid || serverSave.UID,
                    projectname: serverSave.projectname,
                    productType: serverSave.productType,
                    productColor: serverSave.productColor,
                    bodyColor: serverSave.bodyColor,
                    handleColor: serverSave.productColor,
                    ballColor: serverSave.ballColor || '',
                    
                    brightness: serverSave.brightness ? Number(serverSave.brightness) : 1,
                    saturation: serverSave.saturation ? Number(serverSave.saturation) : 1,
                    effect: serverSave.effect || 'none'
                };
                // Save to sessionStorage
                sessionStorage.setItem('tempSelection', JSON.stringify(tempSelectionData));
            }
        })();
    </script>

    <!-- 2D Simulation Scripts (Load AFTER the bridge sets sessionStorage) -->
    <script type="module" th:src="@{/2d-sim/moving.js}"></script>
    <script type="module" th:src="@{/2d-sim/script.js}"></script>
    <script th:src="@{/2d-sim/sim.js}"></script>
    <script th:src="@{/2d-sim/speed.js}"></script>
    <script type="module" th:src="@{/2d-sim/controls.js}"></script>
    <script type="module" th:src="@{/2d-sim/prop.js}"></script>
    <!-- Lucide icons initialization -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
