  <meta charset="UTF-8">
  <style>
    @keyframes juggle-slide {
      100% { transform: translateX(200px); }
    }
    @keyframes juggle-arc {
      0% { transform: rotate(0deg) translateX(200px) rotate(0deg); }
      100% { transform: rotate(-180deg) translateX(200px) rotate(180deg); }
    }
    @keyframes juggle-arc2{
      0% { transform: rotate(0deg) translateX(0px); }
      100% { transform: rotate(-180deg) translateX(400px); }

    }
    @keyframes hand-up{
      0% {transform: rotate(-20deg);}
      50% {transform: rotate(-10deg);}
      100% {transform: rotate(-20deg);}
    }
    @keyframes hand-left{
      0% {transform: rotate(20deg);}
      50% {transform: rotate(10deg);}
      100% {transform: rotate(20deg);}
    }
    @keyframes spin{
      0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
    }
    .lefthand{
      transform-origin: 390px 375px;
      animation: hand-left 1s linear infinite;
    }
    .righthand{
      transform-origin: 600px 375px;
      animation: hand-up 1s linear infinite;
    }
    .ball-slide {
      animation: juggle-slide 1s  linear infinite;
    }
    .ball-slide2 {
      animation: juggle-slide2 1s  linear infinite;
    }
    .ball-arc {
      transform-origin: 700px 500px;
      animation: juggle-arc 1s linear infinite;
    }
    svg {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevents scrollbars if needed */
    }

 </style>

           <script th:inline="javascript">
        (function () {
            const serverSave = /*[[${currentSave}]]*/ null;

            if (serverSave) {
                console.log("Loaded saved project from DB into 2D:", serverSave);

                // 1. Get raw values from DB (defaults to 1 if null)
                let rawBrightness = serverSave.brightness ? Number(serverSave.brightness) : 1;
                let rawSaturation = serverSave.saturation ? Number(serverSave.saturation) : 1;

                // If stored in 3D scale (<= 2), calculate UI percentage (0-100) and rendering scale (0-2)
                let uiBrightness = rawBrightness <= 2 ? rawBrightness * 100 : rawBrightness;
                let uiSaturation = rawSaturation <= 2 ? rawSaturation * 100 : rawSaturation;

                // Package into 2D expected structure
                const tempSelectionData = {
                    UID: serverSave.uid || serverSave.UID,
                    projectname: serverSave.projectname,
                    productType: serverSave.productType,
                    productColor: serverSave.productColor,
                    bodyColor: serverSave.bodyColor,
                    handleColor: serverSave.productColor,
                    ballColor: serverSave.ballColor || '',
                    
                    brightness: serverSave.brightness ? Number(serverSave.brightness) : 1,
                    saturation: serverSave.saturation ? Number(serverSave.saturation) : 1,
                    effect: serverSave.effect || 'none'
                };
                // Save to sessionStorage
                sessionStorage.setItem('tempSelection', JSON.stringify(tempSelectionData));
            }
        })();
    </script>
