<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <style>
    @keyframes juggle-slide {
      100% { transform: translateX(40px); }
    }
    @keyframes juggle-arc {
      0% { transform: rotate(0deg) translateX(40px); }
      100% { transform: rotate(-180deg) translateX(40px); }
    }
    .ball-slide {
      animation: juggle-slide 1s infinite linear;
    }
    .ball-arc {
      transform-origin: 70px 50px; /* Center point of the arc */
      animation: juggle-arc 1s infinite linear;
    }
  </style>
</head>
<body>
  <main>
    <svg width="200" height="100">
      <circle class="ball-slide" cx="30" cy="50" r="10" fill="#ff6d00"/>
      <circle class="ball-slide" cx="70" cy="50" r="10" fill="#f03355"/>
      <circle class="ball-arc" cx="70" cy="50" r="10" fill="#fa3355"/>
    </svg>
  </main>
</body>
</html>
